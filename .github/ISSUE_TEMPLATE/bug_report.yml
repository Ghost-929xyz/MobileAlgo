name: Bug report
description: Report a crash, build failure, or incorrect behavior.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, signing keys, access tokens, or private source code.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Run ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: abi
    attributes:
      label: Device ABI
      placeholder: arm64-v8a
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private data from this report.
          required: true